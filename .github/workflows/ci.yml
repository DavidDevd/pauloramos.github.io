name: CI

# Runs on every pull request, and is called by the deploy workflow so the
# exact artifact that passed these gates is the one that gets published.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GITHUB_PAGES: "true"
  NEXT_PUBLIC_SITE_URL: https://daviddevd.github.io/pauloramos.github.io

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Static build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E and accessibility
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.16.1 autorun

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

      # Only the deploy run needs the site artifact; PRs stop at the gates.
      - name: Upload site artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
