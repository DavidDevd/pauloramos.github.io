name: CI

# Runs on every pull request, and is called by the deploy workflow so the
# exact artifact that passed these gates is the one that gets published.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GITHUB_PAGES: "true"
  NEXT_PUBLIC_SITE_URL: https://daviddevd.github.io/pauloramos.github.io

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Static build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E and accessibility
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.16.1 autorun

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

      # Only the deploy run needs the site artifact; PRs stop at the gates.
      - name: Upload site artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
